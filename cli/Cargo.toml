[package]
name = "voe-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ve"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
rpassword = "7.5.4"
aes-gcm = "0.11.1"
pbkdf2 = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
regex = "1.13.1"
self-replace = "1.5.0"
tempfile = "3.27.0"
