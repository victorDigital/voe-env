services:
  db:
    build:
      context: ./db
    environment:
      POSTGRES_DB: voe
      POSTGRES_USER: voe
      POSTGRES_PASSWORD_FILE: /run/voe/password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - db-password:/run/voe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voe -d voe"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
        - PUBLIC_BETTER_AUTH_URL=${PUBLIC_BETTER_AUTH_URL:-}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - PUBLIC_BETTER_AUTH_URL=${PUBLIC_BETTER_AUTH_URL:-}
      - VOE_CLI_RELEASE_URL=${VOE_CLI_RELEASE_URL:-https://github.com/victorDigital/voe-env/releases/latest/download}
    volumes:
      - db-data:/data
      - db-password:/run/voe:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  postgres-data:
  db-password:
